<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - BookMe</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <h1>📅 BookMe</h1>
        <p>Sign in to your account</p>
      </div>

      <div id="alert-container"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="john@example.com" required autofocus />
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="submitBtn">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Create one here</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    // Redirect if already logged in
    const existingUser = getUser();
    if (existingUser) {
      window.location.href = existingUser.role === 'provider' ? '/provider-dashboard.html' : '/user-dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      setLoading('submitBtn', true, 'Sign In');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const data = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        setAuth(data.token, data.user);
        showAlert('alert-container', 'Login successful! Redirecting...', 'success');

        setTimeout(() => {
          window.location.href = data.user.role === 'provider' ? '/provider-dashboard.html' : '/user-dashboard.html';
        }, 800);
      } catch (error) {
        showAlert('alert-container', error.message, 'error');
        setLoading('submitBtn', false, 'Sign In');
      }
    });
  </script>
</body>
</html>
