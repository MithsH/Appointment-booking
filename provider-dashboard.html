<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provider Dashboard - BookMe</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <div class="container page-content">
    <!-- Page Header -->
    <div class="page-header">
      <div>
        <h1>Provider Dashboard</h1>
        <p id="welcomeMsg">Welcome back!</p>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="stat-num" id="statServices">-</div><div class="stat-label">Services</div></div>
      <div class="stat-card"><div class="stat-num" id="statBookings">-</div><div class="stat-label">Total Bookings</div></div>
      <div class="stat-card"><div class="stat-num" id="statPending">-</div><div class="stat-label">Pending</div></div>
      <div class="stat-card"><div class="stat-num" id="statApproved">-</div><div class="stat-label">Approved</div></div>
    </div>

    <div class="dashboard-grid">
      <!-- Sidebar -->
      <aside class="sidebar">
        <ul class="sidebar-nav">
          <li><a href="#" class="active" data-section="bookings">📋 Bookings</a></li>
          <li><a href="#" data-section="services">🛠 My Services</a></li>
          <li><a href="#" data-section="availability">🕐 Availability</a></li>
        </ul>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- ALERT -->
        <div id="alert-container"></div>

        <!-- BOOKINGS SECTION -->
        <section id="section-bookings" class="card">
          <div class="card-header">
            <h2>All Bookings</h2>
            <button class="btn btn-sm btn-outline" onclick="loadBookings()">🔄 Refresh</button>
          </div>
          <div class="card-body" id="bookingsContainer">
            <div class="loading"><div class="spinner"></div> Loading bookings...</div>
          </div>
        </section>

        <!-- SERVICES SECTION -->
        <section id="section-services" class="card hidden">
          <div class="card-header">
            <h2>My Services</h2>
            <button class="btn btn-sm btn-primary" onclick="openServiceModal()">+ Add Service</button>
          </div>
          <div class="card-body" id="servicesContainer">
            <div class="loading"><div class="spinner"></div> Loading services...</div>
          </div>
        </section>

        <!-- AVAILABILITY SECTION -->
        <section id="section-availability" class="card hidden">
          <div class="card-header">
            <h2>Weekly Availability</h2>
            <button class="btn btn-sm btn-primary" onclick="openAvailabilityModal()">+ Add Schedule</button>
          </div>
          <div class="card-body" id="availabilityContainer">
            <div class="loading"><div class="spinner"></div> Loading availability...</div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- SERVICE MODAL -->
  <div class="modal-overlay hidden" id="serviceModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="serviceModalTitle">Add Service</h3>
        <button class="modal-close" onclick="closeServiceModal()">×</button>
      </div>
      <div class="modal-body">
        <div id="service-alert"></div>
        <form id="serviceForm">
          <input type="hidden" id="serviceId" />
          <div class="form-group">
            <label class="form-label">Service Name *</label>
            <input type="text" id="serviceName" class="form-control" placeholder="e.g., Haircut" required />
          </div>
          <div class="form-group">
            <label class="form-label">Description *</label>
            <textarea id="serviceDesc" class="form-control" placeholder="Describe your service..." required></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Price ($) *</label>
              <input type="number" id="servicePrice" class="form-control" placeholder="50" min="0" step="0.01" required />
            </div>
            <div class="form-group">
              <label class="form-label">Duration (minutes) *</label>
              <input type="number" id="serviceDuration" class="form-control" placeholder="60" min="15" step="15" required />
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeServiceModal()">Cancel</button>
        <button class="btn btn-primary" id="serviceSubmitBtn" onclick="submitService()">Save Service</button>
      </div>
    </div>
  </div>

  <!-- AVAILABILITY MODAL -->
  <div class="modal-overlay hidden" id="availabilityModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Set Availability</h3>
        <button class="modal-close" onclick="closeAvailabilityModal()">×</button>
      </div>
      <div class="modal-body">
        <div id="avail-alert"></div>
        <form id="availabilityForm">
          <div class="form-group">
            <label class="form-label">Day of Week *</label>
            <select id="availDay" class="form-control" required>
              <option value="">-- Select Day --</option>
              <option value="0">Sunday</option>
              <option value="1">Monday</option>
              <option value="2">Tuesday</option>
              <option value="3">Wednesday</option>
              <option value="4">Thursday</option>
              <option value="5">Friday</option>
              <option value="6">Saturday</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Start Time *</label>
              <input type="time" id="availStart" class="form-control" required />
            </div>
            <div class="form-group">
              <label class="form-label">End Time *</label>
              <input type="time" id="availEnd" class="form-control" required />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Slot Duration (minutes) *</label>
            <select id="availSlot" class="form-control" required>
              <option value="15">15 minutes</option>
              <option value="30" selected>30 minutes</option>
              <option value="45">45 minutes</option>
              <option value="60">60 minutes</option>
              <option value="90">90 minutes</option>
              <option value="120">2 hours</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeAvailabilityModal()">Cancel</button>
        <button class="btn btn-primary" id="availSubmitBtn" onclick="submitAvailability()">Save Schedule</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/provider-dashboard.js"></script>
</body>
</html>
